name: Export DIDI database menu

on:
  push:
    paths:
      - '.github/workflows/repair-db-prices.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export menu rows
        run: |
          python - <<'PY'
          import csv, sqlite3
          con = sqlite3.connect('db.sqlite3')
          cur = con.cursor()
          rows = cur.execute('''
              SELECT i.id, c.slug, c.name, i.slug, i.name, i.english_name, i.price
              FROM menu_menuitem i
              JOIN menu_category c ON c.id = i.category_id
              ORDER BY c.sort_order, i.sort_order, i.id
          ''').fetchall()
          with open('menu_db_export.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f)
              w.writerow(['id','category_slug','category_name','item_slug','name','english_name','price'])
              w.writerows(rows)
          print('ROWS:', len(rows))
          con.close()
          PY

      - name: Commit export
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu_db_export.csv
          git commit -m 'Export current menu database for full price verification [skip ci]' || exit 0
          git push origin HEAD:main
