<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10203f">
<title>DIDI | {{ page_title }}</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Tahoma,Arial,sans-serif;background:#10203f;color:#fff}.screen{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.08),transparent 28%),linear-gradient(145deg,#0b1830,#10203f 55%,#172b4e)}.card{width:min(100%,520px);padding:48px 28px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(255,255,255,.045);box-shadow:0 24px 70px rgba(0,0,0,.22)}.brand{direction:ltr;font-size:52px;letter-spacing:9px;font-weight:700}.line{width:46px;height:1px;margin:22px auto 28px;background:#bca477}h1{margin:0;font-size:30px}.status{margin:14px 0 0;color:rgba(255,255,255,.7);font-size:14px;line-height:2}.back{display:inline-flex;align-items:center;justify-content:center;margin-top:32px;min-width:190px;min-height:52px;padding:0 22px;border-radius:999px;background:#f5f1e9;color:#10203f;text-decoration:none;font-weight:700}@media(max-width:560px){.card{padding:40px 20px}.brand{font-size:44px}h1{font-size:26px}}
</style>
</head>
<body><main class="screen"><section class="card"><div class="brand">DIDI</div><div class="line"></div><h1>{{ page_title }}</h1><p class="status">این بخش در حال آماده‌سازی است.<br>به‌زودی در دسترس شما قرار می‌گیرد.</p><a class="back" href="{% url 'menu:welcome' %}">بازگشت به صفحه اصلی</a></section></main></body>
</html>
