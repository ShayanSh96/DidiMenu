<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>DIDI | Welcome</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; min-height: 100%; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            font-family: Tahoma, Arial, sans-serif;
            background: #141414;
            color: #10203f;
        }
        .landing {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 24px 16px;
            background:
                linear-gradient(rgba(8, 12, 18, .64), rgba(8, 12, 18, .64)),
                url('/media/menu/categories/2A9F69E9-5592-4F7D-9E42-E8BC9E0A1324-1152x1536.jpeg') center center / cover no-repeat,
                #141414;
        }
        .landing::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,.03), rgba(0,0,0,.18));
            pointer-events: none;
        }
        .panel {
            position: relative;
            z-index: 1;
            width: min(100%, 410px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .logo-badge {
            width: min(78vw, 330px);
            aspect-ratio: 2.5 / 1;
            margin-bottom: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #fff;
            color: #10203f;
            clip-path: polygon(50% 0, 100% 31%, 93% 38%, 100% 45%, 93% 52%, 100% 59%, 50% 100%, 0 59%, 7% 52%, 0 45%, 7% 38%, 0 31%);
            box-shadow: 0 18px 45px rgba(0,0,0,.28);
        }
        .logo-badge::before,
        .logo-badge::after {
            content: '';
            position: absolute;
            left: 13%;
            right: 13%;
            height: 1px;
            background: rgba(16,32,63,.22);
        }
        .logo-badge::before { top: 31%; }
        .logo-badge::after { bottom: 31%; }
        .logo-inner { text-align: center; direction: ltr; line-height: 1; }
        .logo-year { margin-bottom: 5px; font-size: 8px; }
        .logo-name { font-size: clamp(35px, 9vw, 53px); font-weight: 400; letter-spacing: 2px; }
        .logo-space { margin-top: 5px; font-size: 12px; letter-spacing: 2px; }
        .nav-links {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .nav-link {
            width: min(64vw, 230px);
            min-height: 66px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border: 2px solid #10203f;
            background: rgba(255,255,255,.94);
            color: #10203f;
            text-decoration: none;
            font-size: clamp(20px, 5vw, 25px);
            font-weight: 500;
            box-shadow: 0 8px 22px rgba(0,0,0,.13);
            transition: transform .18s ease, background .18s ease;
        }
        .nav-link:hover { transform: translateY(-2px); background: #fff; }
        .nav-link--muted { background: rgba(233,233,233,.78); }
        @media (max-width: 600px) {
            .landing { padding-top: 28px; padding-bottom: 28px; }
            .panel { width: 100%; }
            .logo-badge { width: min(82vw, 300px); margin-bottom: 52px; }
            .nav-links { gap: 22px; }
            .nav-link { width: min(68vw, 245px); min-height: 60px; font-size: 20px; }
        }
        @media (max-height: 720px) {
            .logo-badge { width: min(62vw, 255px); margin-bottom: 30px; }
            .nav-links { gap: 14px; }
            .nav-link { min-height: 52px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <main class="landing">
        <section class="panel" aria-label="ورود به بخش‌های دیدی">
            <div class="logo-badge" aria-label="DIDI SPACE">
                <div class="logo-inner">
                    <div class="logo-year">2025</div>
                    <div class="logo-name">DIDI</div>
                    <div class="logo-space">SPACE</div>
                </div>
            </div>

            <nav class="nav-links">
                <a class="nav-link" href="{% url 'menu:home' %}">منو</a>
                <a class="nav-link" href="#" aria-disabled="true">داستان‌ما</a>
                <a class="nav-link nav-link--muted" href="#" aria-disabled="true">رویدادها</a>
                <a class="nav-link" href="#" aria-disabled="true">خانواده‌ی دی‌دی</a>
            </nav>
        </section>
    </main>
</body>
</html>
