{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10203f">
    <title>DIDI | Menu</title>
    <link rel="stylesheet" href="{% static 'menu/style.css' %}">
    <style>
        body{margin:0;background:#f5f1e9;color:#10203f}
        .category-page{min-height:100vh;background:#f5f1e9}
        .category-page__hero{padding:30px 20px 26px;text-align:center;background:#10203f;color:#f5f1e9}
        .didi-wordmark{display:block;width:min(58vw,240px);height:auto;margin:0 auto 18px}
        .category-page__title{margin:0 0 7px;font-size:24px;font-weight:700;color:#f5f1e9}
        .category-page__subtitle{margin:0;font-size:13px;color:rgba(245,241,233,.72)}
        .category-page__content{width:min(100%,920px);box-sizing:border-box;margin:0 auto;padding:26px 16px 42px}
        .category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
        .top-category{position:relative;display:block;min-height:150px;overflow:hidden;border-radius:18px;background:#1b2d50;box-shadow:0 10px 28px rgba(16,32,63,.10);text-decoration:none}
        .top-category img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center}
        .top-category:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,17,34,.08) 18%,rgba(8,17,34,.84) 100%)}
        .top-category__placeholder{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.18);font-family:Arial,sans-serif;font-size:22px;font-weight:800;letter-spacing:5px}
        .top-category__title{position:absolute;z-index:2;right:12px;left:12px;bottom:14px;text-align:center;color:#fff;font-size:15px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.35)}
        .category-page__back{display:block;width:fit-content;margin:30px auto 0;color:#7f735e;font-size:12px;text-decoration:none}
        .category-page__tax{margin:12px auto 0;text-align:center;color:#7f735e;font-size:12px;font-weight:400;line-height:1.9}
        @media(max-width:700px){.category-page__hero{padding:28px 18px 24px}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top-category{min-height:132px;border-radius:16px}.didi-wordmark{width:min(64vw,220px)}}
        @media(max-width:380px){.category-page__content{padding-left:12px;padding-right:12px}.category-grid{gap:10px}.top-category{min-height:120px}.top-category__title{font-size:13px}}
    </style>
</head>
<body>
<main class="category-page">
    <header class="category-page__hero">
        <img class="didi-wordmark" src="/media/branding/Artboard%207.png" alt="DIDI SPACE">
        <h1 class="category-page__title">منو</h1>
        <p class="category-page__subtitle">دسته‌بندی مورد نظرت رو انتخاب کن</p>
    </header>

    <section class="category-page__content">
        <div class="category-grid">
            {% for category in categories %}
                <a class="top-category" href="{% url 'menu:home' %}?category={{ category.slug }}">
                    {% if category.image %}
                        <img src="{{ category.image.url }}" alt="{{ category.name }}">
                    {% else %}
                        <div class="top-category__placeholder">DIDI</div>
                    {% endif %}
                    <span class="top-category__title">{{ category.name }}</span>
                </a>
            {% empty %}
                <p>دسته‌بندی فعالی وجود ندارد.</p>
            {% endfor %}
        </div>
        <a class="category-page__back" href="{% url 'menu:welcome' %}">بازگشت به صفحه اصلی</a>
        <p class="category-page__tax">۱۰ درصد مالیات روی فاکتور شما محاسبه خواهد شد</p>
    </section>
</main>
</body>
</html>
