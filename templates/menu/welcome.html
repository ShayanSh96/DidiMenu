<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10203f">
    <title>DIDI | Welcome</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }
        body {
            min-height: 100vh;
            min-height: 100svh;
            font-family: Arial, Tahoma, sans-serif;
            background: #10203f;
            color: #fff;
            direction: ltr;
        }
        .welcome {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 12%, rgba(255,255,255,.10), transparent 26%),
                radial-gradient(circle at 86% 84%, rgba(191,164,119,.18), transparent 31%),
                linear-gradient(145deg, #0b1830 0%, #10203f 52%, #172b4e 100%);
        }
        .welcome::before,
        .welcome::after {
            content: '';
            position: absolute;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 50%;
        }
        .welcome::before { width: 360px; height: 360px; top: -190px; right: -120px; }
        .welcome::after { width: 520px; height: 520px; bottom: -350px; left: -220px; }
        .card {
            position: relative;
            z-index: 1;
            direction: rtl;
            width: calc(100vw - 48px);
            max-width: 520px;
            margin: 0 auto;
            text-align: center;
            padding: 50px 34px 42px;
            border: 1px solid rgba(255,255,255,.13);
            border-radius: 30px;
            background: rgba(255,255,255,.045);
            box-shadow: 0 30px 80px rgba(0,0,0,.22);
            backdrop-filter: blur(8px);
        }
        .eyebrow {
            margin: 0 0 18px;
            direction: ltr;
            color: rgba(255,255,255,.58);
            font-size: 10px;
            letter-spacing: 4px;
            white-space: nowrap;
        }
        .logo {
            direction: ltr;
            font-size: clamp(48px, 16vw, 78px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: 8px;
            text-align: center;
        }
        .line { width: 48px; height: 1px; margin: 27px auto 31px; background: #bca477; }
        h1 { margin: 0; font-size: clamp(24px, 7vw, 34px); font-weight: 700; }
        .copy {
            margin: 15px auto 0;
            max-width: 340px;
            color: rgba(255,255,255,.68);
            font-size: 14px;
            line-height: 2;
        }
        .button {
            width: 100%;
            max-width: 285px;
            min-height: 58px;
            margin: 35px auto 0;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            border-radius: 999px;
            background: #f5f1e9;
            color: #10203f;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 14px 35px rgba(0,0,0,.20);
            transition: transform .2s ease, background .2s ease;
        }
        .button:hover { transform: translateY(-2px); background: #fff; }
        .button b { font-size: 20px; font-weight: 400; }
        .foot {
            margin: 34px 0 0;
            direction: ltr;
            color: rgba(255,255,255,.30);
            font-size: 9px;
            letter-spacing: 4px;
        }
        @media (max-width: 560px) {
            .welcome { padding: 18px; }
            .card {
                width: calc(100vw - 36px);
                max-width: none;
                padding: 40px 20px 34px;
                border-radius: 24px;
            }
            .eyebrow { font-size: 9px; letter-spacing: 3px; }
            .logo { font-size: 54px; letter-spacing: 7px; }
            h1 { font-size: 27px; }
            .copy { font-size: 13px; line-height: 1.9; }
            .button { max-width: 260px; min-height: 56px; }
        }
        @media (max-width: 360px) {
            .card { padding-left: 16px; padding-right: 16px; }
            .logo { font-size: 48px; letter-spacing: 6px; }
            h1 { font-size: 24px; }
            .copy { font-size: 12px; }
        }
    </style>
</head>
<body>
    <main class="welcome">
        <section class="card">
            <p class="eyebrow">CAFE & RESTAURANT</p>
            <div class="logo">DIDI</div>
            <div class="line"></div>
            <h1>به دیدی خوش آمدید</h1>
            <p class="copy">لحظه‌ای خوش در کنار طعم‌های دیدی.<br>برای مشاهده دسته‌بندی‌ها وارد منو شوید.</p>
            <a class="button" href="{% url 'menu:home' %}"><span>مشاهده منو</span><b>←</b></a>
            <p class="foot">DIDI SPACE</p>
        </section>
    </main>
</body>
</html>
